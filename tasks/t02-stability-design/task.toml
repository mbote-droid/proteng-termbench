schema_version = "1.3"
source = "https://github.com/mbote-droid/proteng-termbench"
artifacts = ["/app/design_variant.py"]

[task]
name = "proteng-termbench/t02-stability-design"
authors = [{ name = "Samuel Ngigi Mbote", email = "mbotesamuel9@gmail.com" }]
description = "Choose up to five substitutions that maximise stability from noisy single and double mutant scans, and state calibrated uncertainty; graded against a hidden landscape."
keywords = ["protein-design", "stability", "ddg", "deep-mutational-scanning", "epistasis", "uncertainty"]

[metadata]
task_version = "1.0.0"
domain = "protein engineering"
discipline = "computational protein engineering"
skills = ["epistasis", "noisy measurements", "combinatorial search", "calibration"]
numerical_methods = ["pairwise coupling estimation", "branch-and-bound or beam search", "error propagation"]
difficulty = "hard"
difficulty_explanation = "The landscape is not additive: stabilising substitutions in contact partly cancel and some designed pairs are synergistic; the data contain both effects, and the stated uncertainty is graded."
expected_expert_minutes = 90
reward = "binary: 1 only if every check passes on every hidden case"

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 1
memory_mb = 4096
storage_mb = 4096
workdir = "/app"
