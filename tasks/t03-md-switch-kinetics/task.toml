schema_version = "1.3"
source = "https://github.com/mbote-droid/proteng-termbench"
artifacts = ["/app/switch_analysis.py"]

[task]
name = "proteng-termbench/t03-md-switch-kinetics"
authors = [{ name = "Samuel Ngigi Mbote", email = "mbotesamuel9@gmail.com" }]
description = "Align tumbling frames, measure per-residue fluctuations, find a conformational switch and estimate its populations and rates; graded against the hidden generating chain."
keywords = ["molecular-dynamics", "rmsf", "superposition", "markov-state", "kinetics", "conformational-switch"]

[metadata]
task_version = "1.0.0"
domain = "molecular dynamics"
discipline = "computational protein engineering"
skills = ["trajectory alignment", "RMSF", "hidden Markov models", "rate estimation"]
numerical_methods = ["iterative core superposition", "time-lagged ICA or PCA", "Viterbi decoding", "maximum-likelihood rates"]
difficulty = "hard"
difficulty_explanation = "Superposing on all atoms hides the rigid core's true fluctuations; the switch must be found without labels and its rates estimated from the labelled chain."
expected_expert_minutes = 75
reward = "binary: 1 only if every check passes on every hidden case"

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 1
memory_mb = 4096
storage_mb = 4096
workdir = "/app"
